project_id = "sesasi"

[auth]
site_url = "https://sesasi-six.vercel.app/planner/settings/"
additional_redirect_urls = [
  "http://localhost:3000/planner/settings/",
  "http://127.0.0.1:3000/planner/settings/",
  "https://sesasi-six.vercel.app/planner/settings/",
  "https://sesasi-six.vercel.app/planner/settings/password/",
  "https://sesasi-jingeonhuis-projects.vercel.app/",
  "https://sesasi-jingeonhuis-projects.vercel.app/**",
  "https://sesasi-*-jingeonhuis-projects.vercel.app",
  "https://sesasi-*-jingeonhuis-projects.vercel.app/**",
]
enable_signup = false

[functions.weather]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/weather/index.ts"

[functions.transit]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/transit/index.ts"

[functions.discord-sync]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/discord-sync/index.ts"
